name: CI — Tests y Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests unitarios + BDD + Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Configurar Python 3.11
        run: uv python install 3.11

      - name: Instalar dependencias de desarrollo
        run: uv sync --group dev

      - name: Ejecutar todos los tests con cobertura
        run: |
          uv run pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v

      - name: Verificar pipeline completo
        run: echo "Todos los tests pasaron y cobertura >= 85%"